<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmritiSetu - Bosarot Ki Lage</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <button id="btn-home" class="nav-btn hidden" aria-label="Home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button id="btn-lang" class="nav-btn lang-btn">EN</button>
    </header>

    <!-- Screen A: Home / Welcome -->
    <section id="screen-home" class="screen active">
        <div class="avatar-container">
            <img src="images/avatar_idle.png" id="avatar-home" alt="Friendly Avatar" class="avatar">
        </div>
        <h1 id="text-title" class="title-text">বছৰটকি লাগে?</h1>
        <div class="action-row">
            <button id="btn-speak-welcome" class="speak-btn">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button id="btn-play" class="primary-btn">
                <span id="text-play">খেলক</span>
            </button>
        </div>
    </section>

    <!-- Screen B: Scenario Selection -->
    <section id="screen-scenarios" class="screen hidden">
        <div class="avatar-container-small">
            <img src="images/avatar_idle.png" alt="Avatar" class="avatar-small">
            <button id="btn-speak-scenario-prompt" class="speak-btn small-speak">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </div>
        <h2 id="text-choose-task" class="heading-text">কোনটো কাম কৰিব লাগে?</h2>
        
        <div class="scenario-grid">
            <button class="scenario-card" data-scenario="tea">
                <div class="card-speak-btn scen-speak" data-audio="audio_scenario_tea.mp3" data-textid="scen_tea">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
                <img src="images/scen_tea.png" alt="Tea" class="scenario-icon">
                <span class="scenario-name" id="text-scen-tea">সাহ খাবলৈ আলহী আহিছে</span>
            </button>
            <button class="scenario-card" data-scenario="temple">
                <div class="card-speak-btn scen-speak" data-audio="audio_scenario_temple.mp3" data-textid="scen_temple">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
                <img src="images/scen_temple.png" alt="Temple" class="scenario-icon">
                <span class="scenario-name" id="text-scen-temple">মন্দিৰলৈ যাওঁ আহা</span>
            </button>
            <button class="scenario-card" data-scenario="cooking">
                <div class="card-speak-btn scen-speak" data-audio="audio_scenario_cooking.mp3" data-textid="scen_cooking">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
                <img src="images/scen_cooking.png" alt="Cooking" class="scenario-icon">
                <span class="scenario-name" id="text-scen-cooking">ভাত ৰান্ধোঁ আহা</span>
            </button>
        </div>
    </section>

    <!-- Screen C: Main Game Grid -->
    <section id="screen-game" class="screen hidden">
        <div class="game-header">
            <div class="avatar-container-small">
                <img src="images/avatar_idle.png" id="avatar-game" alt="Avatar" class="avatar-small">
                <button id="btn-speak-question" class="speak-btn small-speak">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
            <h2 id="game-question" class="heading-text">Question goes here</h2>
        </div>

        <div id="item-grid" class="item-grid">
            <!-- Items injected via JS -->
        </div>

        <div class="bottom-action">
            <button id="btn-done" class="primary-btn disabled">
                <span id="text-done">হ'ল</span>
            </button>
        </div>
    </section>

    <!-- Screen D: Feedback -->
    <section id="screen-feedback" class="screen hidden">
        <div class="avatar-container">
            <img src="images/avatar_happy.png" id="avatar-feedback" alt="Happy Avatar" class="avatar">
        </div>
        <h1 id="feedback-message" class="title-text">বাৰু পাইছে! ভাল হৈছে!</h1>
        
        <div id="feedback-visuals" class="feedback-visuals">
            <!-- Correctly picked items shown here -->
        </div>

        <div class="action-row">
            <button id="btn-speak-feedback" class="speak-btn">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button id="btn-play-again" class="primary-btn">
                <span id="text-play-again">আকৌ খেলক</span>
            </button>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
